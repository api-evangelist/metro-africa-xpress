name: Metro Africa Xpress
description: 'Metro Africa Xpress (MAX), operating as maxdrive.ai, is a Nigerian technology-driven
  mobility company on a mission to make transportation safe, affordable, accessible and
  sustainable across Africa. MAX finances and deploys vehicles — including electric two-
  and three-wheelers — to a vetted network of driver-partners ("champions"), and runs a
  drivers services platform, electric-vehicle assembly and charging infrastructure,
  enterprise last-mile logistics, and mobility gov-tech solutions. Emerging from the MIT
  and Techstars ecosystem, MAX is backed by Novastar Ventures, Goodwell, Shell Foundation,
  Breakthrough Energy, Capria and Yamaha, and operates across Nigeria, Cameroon and other
  West African markets. The company publishes a marketing and corporate website only; no
  public developer program, API, or developer portal was found during enrichment.'
